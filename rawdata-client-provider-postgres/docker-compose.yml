services:

  postgresdb:
    image: postgres:18-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      # From PostgreSQL 18 the image keeps its data under /var/lib/postgresql (PGDATA /var/lib/postgresql/18/docker);
      # mounting the old .../data path would leave the data in an anonymous volume.
      - rdcpostgres-test:/var/lib/postgresql
      - ./init-db-and-user.sql:/docker-entrypoint-initdb.d/init.sql

  adminer:
    image: adminer
    ports:
      - 8080:8080

volumes:
  rdcpostgres-test:

